spring.application.name=LogFetch
server.port=8080

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/logs?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# Base64-encoded 256-bit secret. Replace with your own before deploying anywhere real.
jwt.secret=sqIoDW6fsbqhK4ulF7R/7roijbxJh790WWEJgXHEiNY=
# 1 day, in milliseconds
jwt.expiration=86400000
